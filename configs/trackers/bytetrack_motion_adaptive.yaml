name: bytetrack_motion_adaptive
description: Motion tracker with center-distance fallback for small objects.
detector_confidence_floor: 0.10
track_low_thresh: 0.10
track_high_thresh: 0.25
new_track_thresh: 0.35
match_iou: 0.30
adaptive_center_gate: 2.50
adaptive_mahalanobis_gate: 25.0
process_noise: 1.0
measurement_noise: 4.0
min_confirmed_observations: 2
max_lost_seconds: 2.50
max_gap_before_reset_seconds: 1.00
appearance_match_threshold: 0.45
reid_match_threshold: 0.34
appearance_min_quality: 0.20
appearance_update_quality: 0.45
appearance_gallery_size: 8
reid_center_gate: 8.0
appearance_weight: 0.25
reid_appearance_weight: 0.75
alert:
  min_observations: 3
  min_high_confidence_observations: 2
  confirmation_window_seconds: 0.60
  cooldown_seconds: 2.0
  cooldown_scope: per_track
